; ProLasso native rules — replaces fortnite-affinity-watcher.ps1 polling loop
; Import via apply.ps1: Copy to C:\ProgramData\ProcessLasso\prolasso.ini merge or use Lasso GUI Import
; 0x555 = 1365 = physical cores 0,2,4,6,8,10 (6C) leaves HT siblings 0xAAA for system

[DefaultAffinities]
FortniteClient-Win64-Shipping.exe=1365
FortniteClient-Win64-Shipping_EAC_EOS.exe=1365

[DefaultPriorities]
FortniteClient-Win64-Shipping.exe=High
FortniteClient-Win64-Shipping_EAC_EOS.exe=High

[DefaultIOPriorities]
FortniteClient-Win64-Shipping.exe=High
FortniteClient-Win64-Shipping_EAC_EOS.exe=High

[DefaultPowerProfiles]
FortniteClient-Win64-Shipping.exe=Bitsum Highest Performance

[ExcludeAffinities]
; Launchers pinned OFF game cores — HT siblings only 0xAAA = 2730
FortniteLauncher.exe=2730
EpicGamesLauncher.exe=2730
EasyAntiCheat_EOS.exe=2730
